main:
  push:
    - stages:
        - name: sync to gitee
          image: tencentcom/git-sync
          imports: https://cnb.cool/xuxiaowei.io/discourse-app-envs/-/blob/main/envs-sync.yml
          settings:
            target_url: https://gitee.com/xuxiaowei-io/discourse-app-release.git
            auth_type: https
            username: ${GITEE_SYNC_USERNAME}
            password: ${GITEE_SYNC_TOKEN}
        - name: sync to github
          image: tencentcom/git-sync
          imports: https://cnb.cool/xuxiaowei.io/discourse-app-envs/-/blob/main/envs-sync.yml
          settings:
            target_url: https://github.com/xuxiaowei-io/discourse-app-release.git
            auth_type: https
            username: ${GITHUB_SYNC_USERNAME}
            password: ${GITHUB_SYNC_TOKEN}
        - name: sync to gitlink
          image: tencentcom/git-sync
          imports: https://cnb.cool/xuxiaowei.io/discourse-app-envs/-/blob/main/envs-sync.yml
          settings:
            target_url: https://gitlink.org.cn/xuxiaowei-io/discourse-app-release.git
            auth_type: https
            username: ${GITLINK_SYNC_USERNAME}
            password: ${GITLINK_SYNC_TOKEN}
        - name: sync to gitcode
          image: tencentcom/git-sync
          imports: https://cnb.cool/xuxiaowei.io/discourse-app-envs/-/blob/main/envs-sync.yml
          settings:
            target_url: https://gitcode.com/xuxiaowei-io/discourse-app-release.git
            auth_type: https
            username: ${GITCODE_SYNC_USERNAME}
            password: ${GITCODE_SYNC_TOKEN}
